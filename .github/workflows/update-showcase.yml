name: Update Showcase Page

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch repo data & update index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone

          REPO = "realximanta/xenon-exe-bot"
          TOKEN = os.environ["GH_TOKEN"]

          def headers():
              return {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "xenon-showcase-updater",
              }

          def get_json(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", headers=headers()
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode())

          def get_headers(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", headers=headers()
              )
              with urllib.request.urlopen(req) as r:
                  return r.headers

          def html_escape(t):
              return (str(t).replace("&", "&amp;").replace("<", "&lt;")
                      .replace(">", "&gt;").replace('"', "&quot;"))

          def time_ago(iso_date):
              try:
                  dt = datetime.strptime(iso_date, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              except Exception:
                  return iso_date
              secs = int((datetime.now(timezone.utc) - dt).total_seconds())
              if secs < 60: return "just now"
              if secs < 3600: return f"{secs//60} min ago"
              if secs < 86400: return f"{secs//3600} hr ago"
              if secs < 2592000: return f"{secs//86400}d ago"
              if secs < 31536000: return f"{secs//2592000}mo ago"
              return f"{secs//31536000}y ago"

          # --- 1. Repo metadata ---
          repo = get_json(f"/repos/{REPO}")
          stars    = repo.get("stargazers_count", 0)
          forks    = repo.get("forks_count", 0)
          issues   = repo.get("open_issues_count", 0)
          watchers = repo.get("subscribers_count", 0)
          updated  = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # --- 2. Commit count via Link header ---
          hdrs = get_headers(f"/repos/{REPO}/commits?per_page=1")
          link = hdrs.get("Link", "")
          m = re.search(r'page=(\d+)>; rel="last"', link)
          commit_count = int(m.group(1)) if m else 1
          print(f"COMMIT COUNT = {commit_count}")
          print(f"LINK HEADER = {link}")

          # --- 3. Fetch all commits ---
          all_commits = []
          page = 1
          while page <= 5:
              try:
                  batch = get_json(f"/repos/{REPO}/commits?per_page=100&page={page}")
              except Exception as e:
                  print(f"Page {page} failed: {e}")
                  break
              if not batch:
                  break
              all_commits.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          print(f"FETCHED = {len(all_commits)} commits")

          # --- 4. Build commit feed HTML ---
          def build_feed(commits):
              if not commits:
                  return '<p style="color:#8892a4;text-align:center;padding:2rem;">No commits yet.</p>'
              rows = []
              for c in commits:
                  sha = c["sha"][:7]
                  msg = html_escape(c["commit"]["message"].split("\n")[0])
                  author = html_escape(c["commit"]["author"]["name"])
                  ago = time_ago(c["commit"]["author"]["date"])
                  url = c["html_url"]
                  low = msg.lower()
                  if low.startswith("feat"):   icon = '<i class="fas fa-star" style="color:#eab308"></i>'
                  elif low.startswith("fix"):  icon = '<i class="fas fa-bug" style="color:#ef4444"></i>'
                  elif low.startswith("docs"): icon = '<i class="fas fa-book" style="color:#26A5E4"></i>'
                  elif low.startswith("chore"):icon = '<i class="fas fa-screwdriver-wrench" style="color:#8892a4"></i>'
                  else:                        icon = '<i class="fas fa-code-commit" style="color:#26A5E4"></i>'
                  rows.append(
                      f'<a class="commit-item" href="{url}" target="_blank" rel="noopener">'
                      f'<div class="commit-icon">{icon}</div>'
                      f'<div class="commit-body">'
                      f'<div class="commit-msg">{msg}</div>'
                      f'<div class="commit-meta">'
                      f'<span class="commit-sha">{sha}</span>'
                      f'<span class="commit-sep">·</span>'
                      f'<span class="commit-author">{author}</span>'
                      f'<span class="commit-sep">·</span>'
                      f'<span class="commit-time">{ago}</span>'
                      f'</div></div>'
                      f'<div class="commit-arrow"><i class="fas fa-arrow-right"></i></div>'
                      f'</a>'
                  )
              return "\n".join(rows)

          feed_html = build_feed(all_commits)

          # --- 5. Rewrite index.html ---
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          stats_block = f"""<div class="stats-bar" data-aos="fade-in" data-aos-duration="800">
      <div class="stat"><div class="stat-value" id="stat-stars">{stars}</div><div class="stat-label"><i class="fas fa-star"></i> Stars</div></div>
      <div class="stat"><div class="stat-value" id="stat-forks">{forks}</div><div class="stat-label"><i class="fas fa-code-fork"></i> Forks</div></div>
      <div class="stat"><div class="stat-value" id="stat-issues">{issues}</div><div class="stat-label"><i class="fas fa-circle-exclamation"></i> Issues</div></div>
      <div class="stat"><div class="stat-value" id="stat-watchers">{watchers}</div><div class="stat-label"><i class="fas fa-eye"></i> Watchers</div></div>
      <div class="stat"><div class="stat-value" id="stat-commits">{commit_count}</div><div class="stat-label"><i class="fas fa-code-commit"></i> Commits</div></div>
    </div>"""

          html = re.sub(
              r"<!--\s*STATS_START\s*-->.*?<!--\s*STATS_END\s*-->",
              f"<!-- STATS_START -->\n{stats_block}\n<!-- STATS_END -->",
              html, flags=re.DOTALL
          )
          html = re.sub(
              r"<!--\s*COMMITS_FEED_START\s*-->.*?<!--\s*COMMITS_FEED_END\s*-->",
              f"<!-- COMMITS_FEED_START -->\n{feed_html}\n<!-- COMMITS_FEED_END -->",
              html, flags=re.DOTALL
          )
          html = re.sub(
              r'(<span id="last-updated">).*?(</span>)',
              rf"\g<1>{updated}\g<2>", html, flags=re.DOTALL
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print(f"DONE — stars={stars} forks={forks} commits={commit_count}")
          PY

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-update showcase [skip ci]"
            git push
          fi
